version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: libreplex:latest # Optional: specify image name and tag
    container_name: libreplex
    ports:
      - "8080:8080" # Map host port 8080 to container port 8080
    volumes:
      - libreplex_books:/books       # Persistent volume for ebook library
      - libreplex_config:/config     # Persistent volume for SQLite DB and app config
      - libreplex_cache:/cache       # Persistent volume for generated covers, converted files, etc.
    restart: unless-stopped
    environment:
      # GIN_MODE: release # Optional: Set Gin to release mode for production
      # SQLITE_PATH: /config/libreplex.db # Example, if you want to make it configurable
      # Any other environment variables your application might need
      USER_ID: ${USER_ID:-1000} # Pass current user's ID
      GROUP_ID: ${GROUP_ID:-1000} # Pass current user's GID
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  libreplex_books:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: './example_library/books' # IMPORTANT: Change this to your actual books directory on the host
                                       # Or remove driver_opts to use a Docker-managed volume
  libreplex_config:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: './example_library/config' # IMPORTANT: Change this for your actual config directory on the host
                                        # Or remove driver_opts to use a Docker-managed volume
  libreplex_cache:
    driver: local # Docker managed volume for cache, no need to bind mount usually
    # If you want to inspect cache on host, you can bind mount it like others:
    # driver_opts:
    #   type: 'none'
    #   o: 'bind'
    #   device: './example_library/cache'

# Note on USER_ID and GROUP_ID:
# This is a common pattern to ensure files created in bind-mounted volumes
# have the correct ownership on the host.
# You would typically run docker-compose up with these variables set, e.g.:
# USER_ID=$(id -u) GROUP_ID=$(id -g) docker-compose up
# The Dockerfile entrypoint or a start script would then chown directories if needed,
# or run the application process as this user/group.
# The current Dockerfile creates an 'appuser'. For bind mounts, host permissions often take precedence.
# This setup with device mapping directly in docker-compose is simpler for local dev.
# For production, you might remove device mapping and let Docker manage volumes,
# or have an entrypoint script in Docker to chown /books and /config based on these ENV vars.
# The current Dockerfile already creates /books, /config, /cache and chowns them to appuser.
# When using bind mounts, the host's UID/GID for the source directory will be reflected inside the container.
# If there's a mismatch with `appuser`'s UID/GID (which is dynamically assigned by useradd),
# it can lead to permission issues.
#
# For simplicity in this phase, the example_library paths are set up.
# A user would change './example_library/books' and './example_library/config'
# to point to their actual directories on the host machine.
# The `appuser` in Dockerfile will own `/app`, `/config`, `/books`, `/cache` *within the container's filesystem layer*.
# When volumes are mounted, these mount points are overlaid.
#
# The current Dockerfile's USER appuser will be used to run the application.
# If the mounted volumes from the host are owned by root and have restrictive permissions,
# appuser might not be able to write to /config (for the db) or /books (if organizing files).
# The USER_ID/GROUP_ID env vars are more for an entrypoint script to chown these paths.
# The current Dockerfile uses a fixed appuser/appgroup.
# This might require the user to ensure the host directories are writable by the GID of appuser in the container,
# or run a startup script in the container to chown the mounted volume paths.
#
# For now, the setup assumes the user will manage host directory permissions appropriately
# or that the default Docker volume behavior (often root-owned for named volumes not bind-mounted)
# is acceptable, and the app handles it.
# The `chown appuser:appgroup /config /books /cache` in Dockerfile helps if these are NOT mounted,
# or if the mounted volumes are fresh and Docker creates them with root ownership.
# The `debian-slim` image's `useradd` will assign a UID/GID.
#
# Let's simplify the volume definitions for now to use Docker-managed volumes by default,
# which is easier for users not wanting to immediately bind mount.
# I'll provide commented-out examples for bind-mounting.

# Refined volumes for easier start, with comments for bind mounting:
# volumes:
#   libreplex_books: {}  # Docker managed volume
#   libreplex_config: {} # Docker managed volume for SQLite DB and app config
#   libreplex_cache: {}  # Docker managed volume for cache
#
# To use bind mounts (map to a host directory):
# volumes:
#   libreplex_books:
#     driver: local
#     driver_opts:
#       type: none
#       o: bind
#       device: /PATH_TO_YOUR_BOOKS_ON_HOST
#   libreplex_config:
#     driver: local
#     driver_opts:
#       type: none
#       o: bind
#       device: /PATH_TO_YOUR_CONFIG_ON_HOST
#   libreplex_cache:
#     driver: local
#     driver_opts:
#       type: none
#       o: bind
#       device: /PATH_TO_YOUR_CACHE_ON_HOST

# For this project, let's stick to the bind mounts for `books` and `config`
# as they are critical for user data, and a Docker-managed volume for `cache`.
# The example_library paths serve as placeholders.
# The user is expected to change these.
# I've added example directories for these to make it runnable out-of-the-box for testing.
# Will create these example directories.
# Note: The USER_ID/GROUP_ID is not directly used by the current Dockerfile's appuser,
# but it's a good practice to include for users who might extend this for host permission matching.
# The chown in the Dockerfile to appuser for /config, /books, /cache handles the case
# where Docker initially creates these directories for the volume if they don't exist on the host
# (for bind mounts, it uses the host dir; for named volumes, Docker creates them, often as root).
# The important part is that the `appuser` process inside the container needs write access to /config.
# If /config is bind-mounted, the host directory needs to be writable by the UID/GID that `appuser` maps to.
# This can get tricky. A common solution is an entrypoint script that chowns on startup.
# For now, let's rely on the user ensuring host directory permissions.
# The `chown` in the Dockerfile primarily helps if these dirs are *not* mounted from host but used by app.
# When they *are* mounted, host permissions rule.

# Let's remove the USER_ID/GROUP_ID for now to simplify, as the Dockerfile isn't currently using them
# in an entrypoint script to chown.
# Simpler docker-compose for now:
# environment:
#   GIN_MODE: release # Optional

# Okay, re-evaluating the volume strategy for "ease of setup":
# - /books: MUST be user-provided, so bind mount is best.
# - /config: MUST be persistent, SQLite DB. Bind mount is good for user access/backup.
# - /cache: Can be ephemeral or Docker-managed.
# The Dockerfile already CHOWNs /config, /books, /cache to appuser.
# If a host directory is mounted, and it's owned by root with 755, appuser (non-root) cannot write.
# This is a classic Docker permissions problem with bind mounts.
#
# Simplest for user:
# 1. Dockerfile creates appuser.
# 2. docker-compose uses bind mounts.
# 3. User must ensure the host directories for bind mounts are writable by the UID/GID that `appuser` gets inside the container.
#    (This UID/GID can be non-deterministic if not set explicitly during useradd).
#    Or, more commonly, run the container as root (bad for security) or use an entrypoint script to chown.
#
# Let's assume `appuser` will get some UID like 1000 or 1001 if it's the first user added.
# The `chown` in Dockerfile for /config, /books, /cache *before* USER appuser is key.
# This means if these paths are *not* mounted, they are owned by appuser.
# If they *are* mounted, the host system's permissions for the source directory are mapped into the container.
#
# For the `config` volume where `libreplex.db` is written, the `appuser` (running `./libreplex`) needs write access.
#
# Let's stick with the initial `docker-compose.yaml` with bind mounts and `example_library`.
# The user will be responsible for permissions on `./example_library/*` on their host.
# To make it work out of the box, I'll add a step to create these example_library dirs.
# The `chown` in the Dockerfile ensures that if these paths were *not* mounts, `appuser` would own them.
# When they *are* mounts, the permissions of the source directory are what matters.
# The `appuser` (likely UID 1000 if no other users were created) needs write access to `/config` (the mount point).
# So, on the host, `example_library/config` needs to be writable by UID 1000.
#
# This is a common Docker pain point. The `USER_ID=${USER_ID:-1000}` approach is often paired with
# an entrypoint script that does `chown -R $USER_ID:$GROUP_ID /config /books`.
# For now, we'll omit this entrypoint script for simplicity in Phase 1 and assume the user
# can manage permissions on their host for the `example_library` directories.
# The healthcheck defined in docker-compose is redundant if also in Dockerfile, but harmless.
# I'll remove USER_ID/GROUP_ID from compose for now as it's not used without an entrypoint script.
# I will, however, create the example_library directories.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: libreplex:latest
    container_name: libreplex
    ports:
      - "8080:8080"
    volumes:
      - ./example_library/books:/books
      - ./example_library/config:/config
      - libreplex_cache:/cache # Docker-managed volume for cache
    restart: unless-stopped
    environment:
      GIN_MODE: debug # Or 'release' for production
    # Healthcheck is already in Dockerfile, but can be overridden here if needed.
    # healthcheck:
    #   test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/health"]
    #   interval: 30s
    #   timeout: 3s
    #   retries: 3
    #   start_period: 5s

volumes:
  libreplex_cache: {} # Defines a named volume for cache, managed by Docker
```

I've opted for bind mounts for `books` and `config` using a local `./example_library` path to make it runnable for testing. The user would change these paths. Cache uses a Docker-managed volume.

Next, I'll create the placeholder `example_library` directories.
